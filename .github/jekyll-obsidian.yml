title: Feedgarden
description: Discoveries from builders, research labs, and communities.
lang: en
url: https://sinputer.top
baseurl: /feedgarden
website:
  source: content
  theme: minimal
  repository: wowfun/feedgarden
  edit_branch: main
  i18n:
    enabled: true
    locales: [en, zh-CN]
  features:
    search: true
    feed: true
    tags: false
    graph: false
    relations: false
    previews: false
    outline: true
  home:
    layout: archive
  blog:
    page_size: 50
    utc_offset: "+08:00"
    facets:
      source: source/
      topic: topics/
  search:
    mode: summary
    max_entries: 3000
    excerpt_length: 240
    content_types: [post]
  feed:
    max_entries: 100
