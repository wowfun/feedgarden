name: Validate and deploy Feedgarden
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: feedgarden-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      - name: Install the OpenCode acceptance baseline
        run: npm install --prefix "$RUNNER_TEMP/feedgarden-opencode" --no-save --ignore-scripts @opencode/cli-linux-x64@2.0.31
      - name: Verify ACP against a local simulated model
        run: npm run verify:opencode -- --command "$RUNNER_TEMP/feedgarden-opencode/node_modules/@opencode/cli-linux-x64/bin/opencode"
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
      - run: npm run site:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - run: npm run verify:scale
      - run: FEEDGARDEN_VISUAL_ROOT=.local/validation/fixture/.jekyll-obsidian-cache/site FEEDGARDEN_VISUAL_FIXTURE=1 npm run test:visual
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: visual-validation
          path: .local/validation/visual
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: github.event_name != 'pull_request'
        with:
          path: .jekyll-obsidian-cache/site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
